    <div class="page-header d-print-none">
      <div class="container-xl">
        <div class="row align-items-center">
          <div class="col">
            <h2 class="page-title" id="page-title">Cerca</h2>
          </div>
          <div class="col-auto">
            <div class="header-actions">
              <span class="panel-version" title="Versione del pannello">SC Panel v{{ app_version }}</span>

              <!-- Notification bell -->
              <!-- The local user's bell: its own notifications (requests) and
                   the panel's (direct downloads, domain, hooks). -->
              <div class="notif-wrap">
                <button class="header-icon-btn" id="notif-button" data-action="notif:toggle" title="Notifiche">
                  <i class="ti ti-bell"></i>
                  <span class="notif-badge" id="notif-badge" style="display:none"></span>
                </button>
                <div class="notif-panel" id="notif-panel" style="display:none">
                  <div class="notif-header">
                    <span>Notifiche</span>
                    <span class="notif-actions" id="notif-actions">
                      <button class="btn-link-sm" data-action="notif:readAll">Segna lette</button>
                      <button class="btn-link-sm btn-link-danger" data-action="notif:clearAll">Elimina tutte</button>
                    </span>
                  </div>
                  <div id="notif-list"></div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
