# SC Panel — reference deployment.
#
#   docker compose -f docker-compose.template.yml up -d
#
# Then open http://localhost:8000. The panel is local and single-user: there is
# no login and no setup step. It answers only to localhost and loopback
# addresses; to reach it under another name (e.g. http://mypc.lan:8000), list
# that name in ALLOWED_HOSTS below. Writes are accepted only from the panel's
# own origin, so another site open in the browser cannot drive it.
#
# Upgrading from v1 (the pre-authentication panel)? See the "Upgrading" section
# in the README first — in particular the /app/config volume below, which your
# existing compose file does not have.

services:
  web:
    image: ghcr.io/u064241/streamingcommunity-downloader:latest
    # The image runs as an unprivileged user, uid 10001. Optional: run as your
    # own user instead, so downloaded files belong to it. Either way both host
    # folders below must be writable by that uid — after a previous run as
    # root, once: chown -R 10001:10001 /srv/scpanel/config (or your own uid;
    # and the library, if root wrote there). The panel refuses to start, and
    # says which path and uid, when it cannot write its config or temp folder.
    # user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - nfs_storage:/app/videos
      # Requests, notifications, channels, hooks, the source domain and the
      # schedule all live here. Without this volume they are lost on every
      # re-pull, request history included.
      - panel_config:/app/config
    environment:
      - VIDEOS_DIR=/app/videos
      - DB_FILE=/app/config/panel.db
      - DATA_FILE=/app/config/data.json
      - SCHEDULE_FILE=/app/config/schedule.json
      - HOST=0.0.0.0
      - PORT=8000
      # Extra host names the panel answers to, comma-separated. Loopback names
      # and addresses are always allowed; anything else is refused, which is
      # what protects the panel from DNS rebinding.
      # - ALLOWED_HOSTS=mypc.lan
      # Set to 1 ONLY behind a reverse proxy you control. It makes the panel
      # trust X-Forwarded-Host when checking the host it was reached under;
      # exposed directly, that header is attacker-controlled.
      - TRUST_PROXY_HEADERS=0
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

    # Do not scale this service or add uvicorn --workers: download job state is
    # held in memory by a single process, so a second replica would neither see
    # nor be able to report on the other's downloads.
    deploy:
      replicas: 1

  # To update: docker compose pull && docker compose up -d. This fork ships no
  # updater sidecar, so nothing here mounts the Docker socket.

volumes:
  nfs_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/nfs/storage  # ← change to the local path where videos are stored
  panel_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/scpanel/config  # ← change to a local path; create it first
